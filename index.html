<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ludus Magnus: Poker Gladiator School</title>
    <style>
        :root {
            --bg-dark: #120c06;
            --container-bg: #1c140c;
            --gold-primary: #d4af37;
            --gold-dim: #aa841c;
            --gold-subtle: #4a3818;
            --text-light: #f5f0e6;
            --text-dim: #b5a999;
            --accent-red: #8b0000;
            --profit-pos: #66bb6a;
            --profit-neg: #ef5350;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-light);
            font-family: 'Georgia', serif;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
        }

        /* Top-Right Ledger Seal */
        .header-seal {
            position: absolute;
            top: 24px;
            right: 28px;
            text-align: right;
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            gap: 4px;
        }

        .seal-title {
            font-size: 1.15rem;
            font-weight: bold;
            letter-spacing: 2.5px;
            text-transform: uppercase;
            color: var(--gold-primary);
            text-shadow: 1px 1px 3px rgba(0, 0, 0, 0.7);
        }

        .seal-epoch {
            font-size: 0.75rem;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            color: var(--gold-dim);
        }

        /* Vault Trigger Button */
        .vault-trigger-btn {
            margin-top: 6px;
            background: transparent;
            border: 1px solid var(--gold-dim);
            color: var(--gold-primary);
            font-family: 'Georgia', serif;
            font-size: 0.75rem;
            letter-spacing: 1px;
            text-transform: uppercase;
            padding: 5px 12px;
            border-radius: 4px;
            cursor: pointer;
            transition: all 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 5px;
        }

        .vault-trigger-btn:hover {
            background: rgba(212, 175, 55, 0.15);
            border-color: var(--gold-primary);
            box-shadow: 0 0 8px rgba(212, 175, 55, 0.3);
        }

        /* Unlocked User Header Badge Container */
        .vault-badge-container {
            margin-top: 6px;
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            gap: 3px;
        }

        .vault-user-badge {
            background: #191007;
            border: 1px solid var(--gold-dim);
            border-radius: 4px;
            padding: 4px 10px;
            font-size: 0.8rem;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            box-shadow: 0 0 10px rgba(0,0,0,0.5);
        }

        .badge-player {
            font-weight: bold;
            color: var(--gold-primary);
            text-transform: capitalize;
        }

        .badge-status.owe-dominus {
            color: #ff4d4d;
            font-weight: bold;
        }

        .badge-status.dominus-owes {
            color: #2ecc71;
            font-weight: bold;
        }

        .badge-status.settled {
            color: var(--gold-primary);
            font-weight: bold;
        }

        .badge-logout-btn {
            background: transparent;
            border: none;
            color: var(--text-dim);
            font-size: 1rem;
            line-height: 1;
            cursor: pointer;
            padding: 0 2px;
            transition: color 0.2s;
        }

        .badge-logout-btn:hover {
            color: #ff4d4d;
        }

        /* Sub-caption disclaimer below header badge */
        .badge-disclaimer {
            font-size: 0.65rem;
            color: var(--text-dim);
            font-style: italic;
            letter-spacing: 0.3px;
        }

        header {
            text-align: center;
            margin-bottom: 20px;
            margin-top: 10px;
        }

        .logo-container {
            width: 220px;
            height: 220px;
            margin: 0 auto;
            display: flex;
            justify-content: center;
            align-items: center;
            border-radius: 50%;
            overflow: hidden;
            filter: drop-shadow(0 0 15px rgba(212, 175, 55, 0.4));
        }

        .logo-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            object-position: 52.3% 49.2%;
            transform: scale(1.15);
        }

        /* Filter Controls */
        .filter-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
            margin-bottom: 30px;
            width: 100%;
            max-width: 900px;
        }

        .range-selector {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            justify-content: center;
        }

        .range-btn {
            background-color: var(--container-bg);
            border: 1px solid var(--gold-dim);
            color: var(--text-light);
            font-family: 'Georgia', serif;
            font-size: 0.9rem;
            padding: 8px 16px;
            border-radius: 4px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .range-btn:hover {
            background-color: #362817;
            border-color: var(--gold-primary);
        }

        .range-btn.active {
            background-color: var(--gold-primary);
            color: #120c06;
            font-weight: bold;
            box-shadow: 0 0 12px rgba(212, 175, 55, 0.4);
        }

        .section-container {
            background-color: var(--container-bg);
            border: 2px solid var(--gold-dim);
            border-radius: 8px;
            padding: 25px;
            width: 100%;
            max-width: 900px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            margin-bottom: 40px;
            box-sizing: border-box;
        }

        h2 {
            color: var(--gold-primary);
            text-align: center;
            text-transform: uppercase;
            letter-spacing: 1px;
            border-bottom: 1px solid var(--gold-dim);
            padding-bottom: 10px;
            margin-top: 0;
        }

        .date-group {
            border: 1px solid #3a2a18;
            margin-bottom: 10px;
            border-radius: 4px;
            overflow: hidden;
        }

        .date-header {
            background-color: #261c10;
            padding: 12px 15px;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-weight: bold;
            color: var(--gold-primary);
            transition: background 0.2s;
        }

        .date-header:hover {
            background-color: #362817;
        }

        .date-header::after {
            content: '▼';
            font-size: 0.8rem;
            color: var(--text-dim);
        }

        .date-group.active .date-header::after {
            content: '▲';
        }

        .date-content {
            display: none;
            padding: 12px 8px;
            background-color: #160f08;
            overflow-x: auto;
        }

        .date-group.active .date-content {
            display: block;
        }

        /* 5-Column Table with Unified Framing */
        table {
            width: 100%;
            border-collapse: separate;
            border-spacing: 0;
            text-align: center;
            font-size: 0.88rem;
        }

        th, td {
            padding: 8px 10px;
            white-space: nowrap;
        }

        .group-header {
            text-align: center;
            font-size: 0.85rem;
            letter-spacing: 1px;
            text-transform: uppercase;
            padding: 8px 10px;
            font-weight: bold;
            color: var(--gold-primary);
            background: rgba(212, 175, 55, 0.08);
            border-top: 1.5px solid var(--gold-dim);
            border-bottom: 1px solid var(--gold-subtle);
        }

        .header-player-group {
            border-top: 1.5px solid var(--gold-dim);
            border-left: 1.5px solid var(--gold-dim);
            border-right: 1.5px solid var(--gold-dim);
        }

        .header-cash-group {
            border-right: 1.5px solid var(--gold-dim);
        }

        .header-tourney-group {
            border-right: 1.5px solid var(--gold-dim);
        }

        .header-sub-row th {
            color: var(--gold-dim);
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            padding: 6px 10px;
            text-align: center;
            border-bottom: 1px solid var(--gold-subtle);
            background: rgba(212, 175, 55, 0.03);
        }

        .col-player-left { border-left: 1.5px solid var(--gold-dim); }
        .col-player-right { border-right: 1.5px solid var(--gold-dim); }
        .col-cash-right { border-right: 1.5px solid var(--gold-dim); }
        .col-tourney-right { border-right: 1.5px solid var(--gold-dim); }

        tbody tr td {
            border-bottom: 1px solid #261c10;
            color: var(--text-light);
        }

        .td-player-name {
            text-align: left;
            padding-left: 12px;
            font-weight: bold;
            text-transform: capitalize;
            font-size: 0.92rem;
        }

        tbody tr:last-child td {
            border-bottom: 1.5px solid var(--gold-dim);
        }

        .profit-tag {
            font-size: 0.78rem;
            margin-left: 5px;
            font-weight: bold;
        }

        .profit-pos { color: var(--profit-pos); }
        .profit-neg { color: var(--profit-neg); }
        .profit-zero { color: var(--text-dim); }
        .unplayed { color: #554433; font-style: italic; }

        /* Podium / Ledger Styling */
        .podium-container {
            display: flex;
            flex-direction: column;
            gap: 15px;
            margin-top: 15px;
        }

        .year-podium-block {
            margin-bottom: 25px;
            padding: 15px;
            border: 1px solid #3a2a18;
            border-radius: 6px;
            background: #17100a;
        }

        .year-title {
            color: var(--gold-primary);
            font-size: 1.25rem;
            margin-bottom: 10px;
            border-bottom: 1px solid #3a2a18;
            padding-bottom: 5px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .gladiator-card {
            display: flex;
            align-items: center;
            padding: 15px 20px;
            border-radius: 6px;
            background: linear-gradient(135deg, #22180f 0%, #17100a 100%);
            border: 1px solid #44321e;
            position: relative;
        }

        .avatar-box {
            width: 65px;
            height: 65px;
            margin-right: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            border-radius: 50%;
            background: #110904;
            font-family: monospace;
            font-size: 1.1rem;
            font-weight: bold;
            color: var(--gold-primary);
            border: 1px solid #3a2a18;
        }

        .gladiator-info {
            flex-grow: 1;
        }

        .gladiator-name {
            font-size: 1.25rem;
            font-weight: bold;
            margin: 0;
            text-transform: capitalize;
        }

        .gladiator-status {
            font-size: 0.85rem;
            color: var(--text-dim);
            font-style: italic;
            margin: 2px 0 0 0;
        }

        .gladiator-score {
            font-size: 1.3rem;
            font-weight: bold;
            font-family: monospace;
        }

        .tier-primus {
            border: 2px solid var(--gold-primary);
            background: linear-gradient(135deg, #332507 0%, #1c1403 100%);
            box-shadow: 0 0 15px rgba(212, 175, 55, 0.2);
        }
        .tier-primus .gladiator-name { color: var(--gold-primary); }
        .tier-primus .avatar-box { border: 2px solid var(--gold-primary); }
        .tier-primus .gladiator-score { color: #2ecc71; }

        .tier-secundus {
            border: 1px solid #c0c0c0;
            border-left: 5px solid #c0c0c0;
        }
        .tier-secundus .gladiator-name { color: #f0f0f0; }
        .tier-secundus .avatar-box { border: 1px solid #c0c0c0; }
        .tier-secundus .gladiator-score { color: #2ecc71; }

        .tier-tertius {
            border: 1px solid #cd7f32;
            border-left: 5px solid #cd7f32;
        }
        .tier-tertius .gladiator-name { color: #e6b89c; }
        .tier-tertius .avatar-box { border: 1px solid #cd7f32; }
        .tier-tertius .gladiator-score { color: #2ecc71; }

        .tier-warrior {
            border-left: 4px solid var(--text-dim);
        }
        .tier-warrior .gladiator-score { color: var(--text-light); }

        .tier-donkey {
            border: 2px solid var(--accent-red);
            background: linear-gradient(135deg, #260a0a 0%, #140303 100%);
        }
        .tier-donkey .gladiator-name { color: #ff4d4d; }
        .tier-donkey .avatar-box { border: 2px solid var(--accent-red); color: #ff4d4d; }
        .tier-donkey .gladiator-score { color: #ff4d4d; }

        .loading {
            text-align: center;
            color: var(--text-dim);
            font-style: italic;
            padding: 20px;
        }

        /* Gladiator Vault Modal */
        .vault-backdrop {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(0, 0, 0, 0.75);
            backdrop-filter: blur(4px);
            z-index: 999;
            justify-content: center;
            align-items: center;
            padding: 16px;
            box-sizing: border-box;
        }

        .vault-backdrop.open {
            display: flex;
        }

        .vault-card {
            background-color: var(--container-bg);
            border: 2px solid var(--gold-primary);
            border-radius: 8px;
            width: 100%;
            max-width: 380px;
            padding: 24px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
            position: relative;
            box-sizing: border-box;
        }

        .vault-close {
            position: absolute;
            top: 14px;
            right: 16px;
            background: transparent;
            border: none;
            color: var(--text-dim);
            font-size: 1.3rem;
            cursor: pointer;
            transition: color 0.2s;
        }

        .vault-close:hover {
            color: var(--text-light);
        }

        .vault-card h3 {
            color: var(--gold-primary);
            margin: 0 0 15px 0;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            font-size: 1.1rem;
            text-align: center;
            border-bottom: 1px solid var(--gold-subtle);
            padding-bottom: 10px;
        }

        .vault-field {
            margin-bottom: 16px;
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        .vault-field label {
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--gold-dim);
        }

        .vault-field select {
            background: #110904;
            border: 1px solid var(--gold-dim);
            color: var(--text-light);
            font-family: 'Georgia', serif;
            padding: 9px 12px;
            border-radius: 4px;
            font-size: 0.95rem;
            outline: none;
        }

        .password-input-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }

        .password-input-wrapper input {
            width: 100%;
            background: #110904;
            border: 1px solid var(--gold-dim);
            color: var(--text-light);
            font-family: 'Georgia', serif;
            padding: 9px 40px 9px 12px;
            border-radius: 4px;
            font-size: 0.95rem;
            outline: none;
            box-sizing: border-box;
        }

        .password-toggle-btn {
            position: absolute;
            right: 8px;
            background: transparent;
            border: none;
            color: var(--gold-dim);
            font-size: 1rem;
            cursor: pointer;
            padding: 4px;
            line-height: 1;
            transition: color 0.2s;
            user-select: none;
        }

        .password-toggle-btn:hover {
            color: var(--gold-primary);
        }

        .vault-field select:focus,
        .password-input-wrapper input:focus {
            border-color: var(--gold-primary);
            box-shadow: 0 0 6px rgba(212, 175, 55, 0.4);
        }

        .vault-submit {
            width: 100%;
            background-color: var(--gold-primary);
            border: 1px solid var(--gold-dim);
            color: #120c06;
            font-family: 'Georgia', serif;
            font-weight: bold;
            font-size: 0.95rem;
            padding: 10px;
            border-radius: 4px;
            cursor: pointer;
            transition: all 0.2s;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-top: 6px;
        }

        .vault-submit:hover {
            background-color: #e5b358;
            box-shadow: 0 0 12px rgba(212, 175, 55, 0.4);
        }

        .vault-error {
            color: #ff4d4d;
            font-size: 0.85rem;
            margin-top: 8px;
            text-align: center;
            display: none;
        }

        @media (max-width: 768px) {
            body { padding: 12px 6px; }
            .section-container { padding: 16px 8px; }
            .header-seal {
                position: static;
                text-align: center;
                align-items: center;
                margin-bottom: 14px;
            }
            .vault-badge-container {
                align-items: center;
            }
            th, td { padding: 6px 8px; }
            .td-player-name { padding-left: 8px !important; }
        }
    </style>
</head>
<body>

    <!-- Upper Right Header Seal with Vault Access -->
    <div class="header-seal">
        <span class="seal-title">Ludus Magnus</span>
        <span class="seal-epoch">Poker Gladiator School • Circa 2026 AD</span>

        <!-- Check Your Ludus Balance Trigger -->
        <button type="button" class="vault-trigger-btn" id="vault-open-btn" onclick="openVaultModal()">📜 Check Your Ludus Balance</button>

        <!-- Unlocked Persistent Balance Banner with Disclaimer Sub-caption -->
        <div id="vault-badge-container" class="vault-badge-container" style="display: none;">
            <div class="vault-user-badge">
                <span id="vault-badge-name" class="badge-player"></span>
                <span id="vault-badge-debt" class="badge-status"></span>
                <button type="button" class="badge-logout-btn" onclick="handleVaultLogout()" title="Lock / Sign out">&times;</button>
            </div>
            <span class="badge-disclaimer">Amount updated upon the close of battle night, not live during combat.</span>
        </div>
    </div>

    <header>
        <div class="logo-container">
            <img class="logo-img" src="logo.png?v=2" alt="Ludus Magnus Logo" id="main-logo" onerror="handleLogoError()">
            <svg id="fallback-logo" style="display:none; width:150px; height:150px;" viewBox="0 0 100 100">
                <path d="M50,5 L85,25 L85,65 C85,85 50,95 50,95 C50,95 15,85 15,65 L15,25 Z" fill="none" stroke="#d4af37" stroke-width="4"/>
                <path d="M35,35 L65,65 M65,35 L35,65" stroke="#aa841c" stroke-width="3"/>
            </svg>
        </div>
    </header>

    <div class="filter-wrapper">
        <div class="range-selector">
            <button type="button" class="range-btn active" data-range="current-month">Current Month</button>
            <button type="button" class="range-btn" data-range="last-3-months">Last 3 Months</button>
            <button type="button" class="range-btn" data-range="current-year">Current Year</button>
            <button type="button" class="range-btn" data-range="all-years">Across the Years</button>
        </div>
    </div>

    <div class="section-container">
        <h2>⚔️ Arena Battles</h2>
        <div id="standings-target">
            <div class="loading">Evaluating arena champions...</div>
        </div>
    </div>

    <div class="section-container">
        <h2>⚔ Battle Ledger Timeline</h2>
        <div id="ledger-target">
            <div class="loading">Unrolling ancient ledger archives...</div>
        </div>
    </div>

    <!-- Private Vault Modal -->
    <div id="vault-modal" class="vault-backdrop">
        <div class="vault-card">
            <button type="button" class="vault-close" onclick="closeVaultModal()">&times;</button>
            <h3>📜 Treasury Ledger</h3>

            <form onsubmit="handleVaultLogin(event)">
                <div class="vault-field">
                    <label for="vault-player-select">Gladiator</label>
                    <select id="vault-player-select" required>
                        <option value="" disabled selected>Select gladiator...</option>
                    </select>
                </div>

                <div class="vault-field">
                    <label for="vault-password-input">Password</label>
                    <div class="password-input-wrapper">
                        <input type="password" id="vault-password-input" placeholder="Enter arena passcode" required autocomplete="off">
                        <button type="button" class="password-toggle-btn" id="toggle-pw-btn" onclick="togglePasswordVisibility()" title="Show/Hide Password">👁</button>
                    </div>
                </div>

                <button type="submit" class="vault-submit" id="vault-submit-btn">Unlock Balance</button>
            </form>

            <div id="vault-error-msg" class="vault-error"></div>
        </div>
    </div>

    <script>
        const VAULT_API_URL = 'https://script.google.com/macros/s/AKfycbwqrMTok0Ffyb6cuf2zbDNnggzPtCmoMOKHdIU71niZYy5bhekRwy2YlEDFE_nE27kH/exec';

        function handleLogoError() {
            document.getElementById('main-logo').style.display = 'none';
            document.getElementById('fallback-logo').style.display = 'block';
        }

        const sheetId = '1V62YP2K9cdN8ws1cf3WTmKwXzzW83KUAFcOGgN_s99M';
        const csvUrl = `https://docs.google.com/spreadsheets/d/${sheetId}/export?format=csv&gid=0`;
        const infoUrl = `https://docs.google.com/spreadsheets/d/${sheetId}/gviz/tq?tqx=out:csv&sheet=Info`;

        let allRecords = [];
        let colIndices = {};
        let activeRange = 'current-month';

        function fetchSheetData() {
            fetch(csvUrl + `&t=${Date.now()}`, { cache: 'no-store' })
                .then(res => {
                    if(!res.ok) throw new Error("Network configuration block detected.");
                    return res.text();
                })
                .then(csvText => {
                    const rows = parseCSV(csvText);
                    if(rows.length < 2) {
                        document.getElementById('standings-target').innerHTML = "<div class='loading'>The arena matrix ledger is empty.</div>";
                        document.getElementById('ledger-target').innerHTML = "<div class='loading'>No gladiators found.</div>";
                        return;
                    }
                    initApp(rows);
                })
                .catch(err => {
                    console.error("Sheet sync error:", err);
                    document.getElementById('standings-target').innerHTML = "<div class='loading' style='color:#8b0000;'>Connection Broken: Ensure your Google Sheet configuration settings are set public!</div>";
                });
        }

        function fetchInfoPlayers() {
            fetch(infoUrl + `&t=${Date.now()}`, { cache: 'no-store' })
                .then(res => {
                    if (!res.ok) throw new Error("Could not load Info tab");
                    return res.text();
                })
                .then(csvText => {
                    const rows = parseCSV(csvText);
                    if (rows.length < 2) return;

                    const headers = rows[0].map(h => h.trim().toUpperCase());
                    let playerColIdx = headers.findIndex(h => h.includes('PLAYER') || h.includes('NAME') || h.includes('GLADIATOR'));
                    if (playerColIdx === -1) playerColIdx = 0; // Default to first column if no named header

                    const validPlayers = new Set();
                    for (let i = 1; i < rows.length; i++) {
                        const name = rows[i][playerColIdx];
                        if (name && name.trim() !== '') {
                            validPlayers.add(name.trim());
                        }
                    }

                    if (validPlayers.size > 0) {
                        populateVaultPlayersFromList(Array.from(validPlayers));
                    }
                })
                .catch(err => {
                    console.warn("Could not fetch Info tab for login list:", err);
                });
        }

        // Initial fetches
        fetchSheetData();
        fetchInfoPlayers();

        function parseCSV(text) {
            const lines = text.split('\n');
            return lines.map(line => {
                return line.split(/,(?=(?:(?:[^"]*"){2})*[^"]*$)/).map(cell => cell.replace(/^"|"$/g, '').trim());
            });
        }

        function initApp(dataRows) {
            const headers = dataRows[0].map(h => h.trim().toUpperCase());

            colIndices = {
                date: headers.indexOf('DATE'),
                name: headers.indexOf('NAME'),
                cashBuy: headers.indexOf('CASH BUYIN'),
                cashWin: headers.indexOf('CASH WINNINGS'),
                tourneyBuy: headers.indexOf('TOURNEY BUYIN'),
                tourneyWin: headers.indexOf('TOURNEY WINNINGS')
            };

            allRecords = dataRows.slice(1).filter(row => {
                const hasDate = colIndices.date !== -1 && row[colIndices.date] && row[colIndices.date].trim() !== '';
                const hasName = colIndices.name !== -1 && row[colIndices.name] && row[colIndices.name].trim() !== '';
                return hasDate && hasName;
            });

            const buttons = document.querySelectorAll('.range-btn');
            buttons.forEach(btn => {
                btn.onclick = () => {
                    buttons.forEach(b => b.classList.remove('active'));
                    btn.classList.add('active');
                    activeRange = btn.dataset.range;
                    updateDashboard();
                };
            });

            updateDashboard();

            // Refresh vault if logged in during current session
            refreshActiveVaultBalance();
        }

        function populateVaultPlayersFromList(namesList) {
            const select = document.getElementById('vault-player-select');
            const currentSelected = select.value || sessionStorage.getItem('ludus_session_player');
            select.innerHTML = '<option value="" disabled selected>Select gladiator...</option>';

            namesList.sort().forEach(n => {
                const opt = document.createElement('option');
                opt.value = n;
                opt.textContent = n.charAt(0).toUpperCase() + n.slice(1);
                select.appendChild(opt);
            });

            if (currentSelected) {
                select.value = currentSelected;
            }
        }

        function parseRecordDate(dateStr) {
            if (!dateStr) return null;
            const parts = dateStr.trim().split(/[-/]/);
            if (parts.length === 3) {
                if (parts[0].length === 4) return new Date(parts[0], parts[1] - 1, parts[2]);
                return new Date(parts[2], parts[0] - 1, parts[1]);
            }
            const d = new Date(dateStr);
            return isNaN(d) ? null : d;
        }

        function updateDashboard() {
            const now = new Date();
            const currYear = now.getFullYear();
            const currMonth = now.getMonth();

            if (activeRange === 'all-years') {
                renderAllYearsView();
                return;
            }

            const filtered = allRecords.filter(row => {
                const d = parseRecordDate(row[colIndices.date]);
                if (!d) return false;

                if (activeRange === 'current-month') {
                    return d.getFullYear() === currYear && d.getMonth() === currMonth;
                } else if (activeRange === 'last-3-months') {
                    const startDate = new Date(currYear, currMonth - 2, 1, 0, 0, 0, 0);
                    const endDate = new Date(currYear, currMonth + 1, 0, 23, 59, 59, 999);
                    return d >= startDate && d <= endDate;
                } else if (activeRange === 'current-year') {
                    return d.getFullYear() === currYear;
                }
                return true;
            });

            renderStandings(filtered);
            renderLedger(filtered);
        }

        function formatVal(cell) {
            if (cell === undefined || cell === null || cell.trim() === '') {
                return '<span class="unplayed">—</span>';
            }
            return cell;
        }

        function formatProfitTag(profit) {
            const absProfit = Math.abs(profit);
            if (profit > 0) return `<span class="profit-tag profit-pos">(${absProfit})</span>`;
            if (profit < 0) return `<span class="profit-tag profit-neg">(${absProfit})</span>`;
            return `<span class="profit-tag profit-zero">(0)</span>`;
        }

        function ensureDollarSign(amt) {
            if (amt === undefined || amt === null) return '$0';
            const num = parseFloat(String(amt).replace(/[^0-9.-]+/g, '')) || 0;
            return num % 1 === 0 ? `$${num}` : `$${num.toFixed(2)}`;
        }

        function renderStandings(records) {
            const groups = {};
            records.forEach(row => {
                const date = row[colIndices.date] ? row[colIndices.date].trim() : 'Unknown Date';
                if (!groups[date]) groups[date] = [];
                groups[date].push(row);
            });

            const dates = Object.keys(groups);
            if (dates.length === 0) {
                document.getElementById('standings-target').innerHTML = "<div class='loading'>No records found in this epoch.</div>";
                return;
            }

            dates.sort((a, b) => {
                const dateA = parseRecordDate(a) || 0;
                const dateB = parseRecordDate(b) || 0;
                return dateB - dateA;
            });

            let standingsHtml = '';
            dates.forEach((date, index) => {
                const isOpen = index === 0 ? 'active' : '';

                standingsHtml += `
                    <div class="date-group ${isOpen}" id="group-${index}">
                        <div class="date-header" onclick="toggleDate('group-${index}')">${date}</div>
                        <div class="date-content">
                            <table>
                                <thead>
                                    <tr>
                                        <th class="group-header header-player-group">PLAYER</th>
                                        <th colspan="2" class="group-header header-cash-group">🪙 CASH</th>
                                        <th colspan="2" class="group-header header-tourney-group">🏅 TOURNAMENT</th>
                                    </tr>
                                    <tr class="header-sub-row">
                                        <th class="col-player-left col-player-right" style="border-bottom: 1px solid var(--gold-subtle);">&nbsp;</th>
                                        <th>IN</th>
                                        <th class="col-cash-right">OUT</th>
                                        <th>IN</th>
                                        <th class="col-tourney-right">OUT</th>
                                    </tr>
                                </thead>
                                <tbody>
                `;

                groups[date].forEach(row => {
                    const rawCB = row[colIndices.cashBuy];
                    const rawCW = row[colIndices.cashWin];
                    const rawTB = row[colIndices.tourneyBuy];
                    const rawTW = row[colIndices.tourneyWin];

                    const hasCash = (rawCB !== undefined && rawCB !== null && rawCB.trim() !== '') ||
                                    (rawCW !== undefined && rawCW !== null && rawCW.trim() !== '');
                    const hasTourney = (rawTB !== undefined && rawTB !== null && rawTB.trim() !== '') ||
                                      (rawTW !== undefined && rawTW !== null && rawTW.trim() !== '');

                    const cBuy = parseFloat(rawCB) || 0;
                    const cWin = parseFloat(rawCW) || 0;
                    const tBuy = parseFloat(rawTB) || 0;
                    const tWin = parseFloat(rawTW) || 0;

                    const cashProfit = cWin - cBuy;
                    const tourneyProfit = tWin - tBuy;
                    const totalProfit = (hasCash ? cashProfit : 0) + (hasTourney ? tourneyProfit : 0);
                    const playedAny = hasCash || hasTourney;

                    const cashOutDisplay = hasCash ? `${formatVal(rawCW)} ${formatProfitTag(cashProfit)}` : '<span class="unplayed">—</span>';
                    const tourneyOutDisplay = hasTourney ? `${formatVal(rawTW)} ${formatProfitTag(tourneyProfit)}` : '<span class="unplayed">—</span>';
                    const playerTag = playedAny ? formatProfitTag(totalProfit) : '';

                    standingsHtml += `
                        <tr>
                            <td class="td-player-name col-player-left col-player-right">
                                <span>${row[colIndices.name] || '-'}</span>${playerTag}
                            </td>

                            <td>${formatVal(rawCB)}</td>
                            <td class="col-cash-right">${cashOutDisplay}</td>

                            <td>${formatVal(rawTB)}</td>
                            <td class="col-tourney-right">${tourneyOutDisplay}</td>
                        </tr>
                    `;
                });

                standingsHtml += `</tbody></table></div></div>`;
            });
            document.getElementById('standings-target').innerHTML = standingsHtml;
        }

        function getRankedPlayers(records) {
            const playerTotals = {};
            records.forEach(row => {
                const name = row[colIndices.name] ? row[colIndices.name].trim().toLowerCase() : null;
                if (!name) return;

                const cBuy = parseFloat(row[colIndices.cashBuy]) || 0;
                const tBuy = parseFloat(row[colIndices.tourneyBuy]) || 0;
                const cWin = parseFloat(row[colIndices.cashWin]) || 0;
                const tWin = parseFloat(row[colIndices.tourneyWin]) || 0;

                const netProfit = (cWin + tWin) - (cBuy + tBuy);
                playerTotals[name] = (playerTotals[name] || 0) + netProfit;
            });

            return Object.keys(playerTotals).map(name => ({
                name: name,
                score: playerTotals[name]
            })).sort((a, b) => b.score - a.score);
        }

        function renderLedger(records) {
            const rankedPlayers = getRankedPlayers(records);

            if (rankedPlayers.length === 0) {
                document.getElementById('ledger-target').innerHTML = "<div class='loading'>No gladiators found for this epoch.</div>";
                return;
            }

            let ledgerHtml = '<div class="podium-container">';
            rankedPlayers.forEach((player, idx) => {
                let tierClass = 'tier-warrior';
                let rankTitle = 'Gladiator';

                if (idx === 0) {
                    tierClass = 'tier-primus';
                    rankTitle = 'Primus • Arena Champion';
                } else if (idx === 1) {
                    tierClass = 'tier-secundus';
                    rankTitle = 'Secundus • Second Order';
                } else if (idx === 2) {
                    tierClass = 'tier-tertius';
                    rankTitle = 'Tertius • Third Order';
                } else if (idx === rankedPlayers.length - 1 && rankedPlayers.length > 3) {
                    tierClass = 'tier-donkey';
                    rankTitle = 'Asinus • Field Donkey';
                }

                const scoreFormatted = (player.score >= 0 ? '+' : '') + player.score;

                ledgerHtml += `
                    <div class="gladiator-card ${tierClass}">
                        <div class="avatar-box">#${idx + 1}</div>
                        <div class="gladiator-info">
                            <div class="gladiator-name">${player.name}</div>
                            <div class="gladiator-status">${rankTitle}</div>
                        </div>
                        <div class="gladiator-score">${scoreFormatted}</div>
                    </div>
                `;
            });

            ledgerHtml += '</div>';
            document.getElementById('ledger-target').innerHTML = ledgerHtml;
        }

        function renderAllYearsView() {
            renderStandings(allRecords);

            const yearlyRecords = {};
            allRecords.forEach(row => {
                const d = parseRecordDate(row[colIndices.date]);
                const year = d ? d.getFullYear() : 'Ancient Epoch';
                if (!yearlyRecords[year]) yearlyRecords[year] = [];
                yearlyRecords[year].push(row);
            });

            const years = Object.keys(yearlyRecords).sort((a, b) => b - a);
            let ledgerHtml = '';

            const romanRankConfig = [
                { tier: 'tier-primus', title: 'Primus • Arena Champion' },
                { tier: 'tier-secundus', title: 'Secundus • Second Order' },
                { tier: 'tier-tertius', title: 'Tertius • Third Order' }
            ];

            years.forEach(year => {
                const top3 = getRankedPlayers(yearlyRecords[year]).slice(0, 3);
                if (top3.length === 0) return;

                ledgerHtml += `
                    <div class="year-podium-block">
                        <div class="year-title">Anno ${year}</div>
                        <div class="podium-container">
                `;

                top3.forEach((player, idx) => {
                    const role = romanRankConfig[idx];
                    const scoreFormatted = (player.score >= 0 ? '+' : '') + player.score;

                    ledgerHtml += `
                        <div class="gladiator-card ${role.tier}">
                            <div class="avatar-box">#${idx + 1}</div>
                            <div class="gladiator-info">
                                <div class="gladiator-name">${player.name}</div>
                                <div class="gladiator-status">${role.title}</div>
                            </div>
                            <div class="gladiator-score">${scoreFormatted}</div>
                        </div>
                    `;
                });

                ledgerHtml += `</div></div>`;
            });

            document.getElementById('ledger-target').innerHTML = ledgerHtml;
        }

        function toggleDate(id) {
            const el = document.getElementById(id);
            if (el) el.classList.toggle('active');
        }

        /* Password Visibility Toggle */
        function togglePasswordVisibility() {
            const pwInput = document.getElementById('vault-password-input');
            const toggleBtn = document.getElementById('toggle-pw-btn');

            if (pwInput.type === 'password') {
                pwInput.type = 'text';
                toggleBtn.textContent = '🔒';
            } else {
                pwInput.type = 'password';
                toggleBtn.textContent = '👁';
            }
        }

        /* Vault Modal & Header Banner Logic */
        function applyVaultSession(playerName, debtType, amount) {
            const dType = (debtType || '').toLowerCase();
            const isDebt = dType.includes('owes me') || dType === 'owes';
            const openBtn = document.getElementById('vault-open-btn');
            const badgeContainer = document.getElementById('vault-badge-container');
            const nameSpan = document.getElementById('vault-badge-name');
            const debtSpan = document.getElementById('vault-badge-debt');
            const formattedAmount = ensureDollarSign(amount);

            const numericVal = parseFloat(String(amount).replace(/[^0-9.-]+/g, '')) || 0;

            nameSpan.textContent = playerName + ':';

            if (numericVal === 0) {
                debtSpan.textContent = 'Debt-free! Honor intact';
                debtSpan.className = 'badge-status settled';
            } else if (isDebt) {
                debtSpan.textContent = `${formattedAmount} owed to restore thy honor`;
                debtSpan.className = 'badge-status owe-dominus';
            } else {
                debtSpan.textContent = `Victorious! ${formattedAmount} in thy arena reserve`;
                debtSpan.className = 'badge-status dominus-owes';
            }

            openBtn.style.display = 'none';
            badgeContainer.style.display = 'flex';
        }

        function handleVaultLogout() {
            sessionStorage.removeItem('ludus_session_player');
            sessionStorage.removeItem('ludus_session_pass');
            document.getElementById('vault-badge-container').style.display = 'none';
            document.getElementById('vault-open-btn').style.display = 'inline-flex';
        }

        function openVaultModal() {
            document.getElementById('vault-modal').classList.add('open');
            document.getElementById('vault-error-msg').style.display = 'none';
            document.getElementById('vault-password-input').value = '';
        }

        function closeVaultModal() {
            document.getElementById('vault-modal').classList.remove('open');
        }

        function handleVaultLogin(e) {
            e.preventDefault();
            const player = document.getElementById('vault-player-select').value;
            const pass = document.getElementById('vault-password-input').value;
            const btn = document.getElementById('vault-submit-btn');
            const errBox = document.getElementById('vault-error-msg');

            errBox.style.display = 'none';
            btn.textContent = 'Verifying...';
            btn.disabled = true;

            const targetUrl = `${VAULT_API_URL}?name=${encodeURIComponent(player)}&password=${encodeURIComponent(pass)}&t=${Date.now()}`;

            fetch(targetUrl, { cache: 'no-store' })
                .then(r => r.json())
                .then(data => {
                    btn.textContent = 'Unlock Balance';
                    btn.disabled = false;

                    if (!data.success) {
                        errBox.textContent = data.message || 'Verification failed.';
                        errBox.style.display = 'block';
                        return;
                    }

                    // Keep credentials in temporary session storage only
                    sessionStorage.setItem('ludus_session_player', player);
                    sessionStorage.setItem('ludus_session_pass', pass);

                    // Immediately close modal and reveal top banner
                    closeVaultModal();
                    applyVaultSession(player, data.debtType, data.amount);
                })
                .catch(err => {
                    console.error(err);
                    btn.textContent = 'Unlock Balance';
                    btn.disabled = false;
                    errBox.textContent = 'Could not contact vault API. Check Apps Script URL.';
                    errBox.style.display = 'block';
                });
        }

        /* Periodic Polling & Wake-Up Sync */
        function refreshActiveVaultBalance() {
            const sessionPlayer = sessionStorage.getItem('ludus_session_player');
            const sessionPass = sessionStorage.getItem('ludus_session_pass');
            if (!sessionPlayer || !sessionPass) return;

            fetch(`${VAULT_API_URL}?name=${encodeURIComponent(sessionPlayer)}&password=${encodeURIComponent(sessionPass)}&t=${Date.now()}`, {
                cache: 'no-store'
            })
            .then(r => r.json())
            .then(data => {
                if (data.success) {
                    applyVaultSession(sessionPlayer, data.debtType, data.amount);
                }
            })
            .catch(err => console.error("Poll update error:", err));
        }

        function pollAllData() {
            fetchSheetData();
            fetchInfoPlayers();
            refreshActiveVaultBalance();
        }

        // Wake-up refresh when player unlocks phone or switches back to tab
        document.addEventListener('visibilitychange', () => {
            if (document.visibilityState === 'visible') {
                pollAllData();
            }
        });

        // 5-minute background pulse (300,000 ms)
        setInterval(pollAllData, 300000);
    </script>
</body>
</html>
