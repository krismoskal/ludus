<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ludus Magnus - Poker Gladiator School</title>
    <style>
        body {
            background-color: #120e0a;
            color: #d4b589;
            font-family: 'Cinzel', 'Georgia', serif;
            margin: 0;
            padding: 20px;
            text-align: center;
        }
        .container {
            max-width: 1000px;
            margin: 0 auto;
            background: #1c1510;
            border: 2px solid #6b4e28;
            border-radius: 8px;
            padding: 30px;
            box-shadow: 0 0 20px rgba(0,0,0,0.8);
        }
        h1 {
            color: #f3af4a;
            font-size: 2.5em;
            margin-bottom: 5px;
            text-transform: uppercase;
            letter-spacing: 2px;
        }
        h2 {
            color: #d4b589;
            font-size: 1.5em;
            margin-top: 0;
            margin-bottom: 30px;
            letter-spacing: 1px;
        }
        .tabs {
            display: flex;
            justify-content: center;
            margin-bottom: 20px;
            gap: 10px;
        }
        .tab-btn {
            background: #2d2219;
            color: #d4b589;
            border: 1px solid #6b4e28;
            padding: 10px 20px;
            cursor: pointer;
            text-transform: uppercase;
            font-size: 0.9em;
            transition: all 0.3s ease;
        }
        .tab-btn:hover, .tab-btn.active {
            background: #f3af4a;
            color: #120e0a;
            font-weight: bold;
            border-color: #f3af4a;
        }
        .table-container {
            background: #0f0b08;
            border: 1px solid #3d2d1b;
            padding: 20px;
            min-height: 200px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
        }
        th, td {
            padding: 12px;
            border-bottom: 1px solid #3d2d1b;
            text-align: left;
        }
        th {
            background-color: #2d2219;
            color: #f3af4a;
            text-transform: uppercase;
            font-size: 0.9em;
        }
        tr:hover {
            background-color: #1c1510;
        }
        .status-msg {
            font-style: italic;
            color: #8a7051;
        }
        .error-msg {
            color: #ff6b6b;
            font-weight: bold;
        }
        .ledger-title {
            margin-top: 40px;
            color: #f3af4a;
            font-size: 1.8em;
            text-transform: uppercase;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="logo-area">
            <!-- Placeholder for Ludus of Kris Logo -->
            <div style="font-size: 50px; margin-bottom: 10px;">⚔️</div>
        </div>
        <h1>Ludus Magnus</h1>
        <div style="font-size: 0.8em; color: #8a7051; margin-bottom: 20px;">circa 2026 AD</div>
        <h2>Poker Gladiator School</h2>

        <h3>Arena Standings</h3>
        <div class="tabs">
            <button class="tab-btn active" onclick="switchTab('month')">This Month</button>
            <button class="tab-btn" onclick="switchTab('year')">This Year</button>
            <button class="tab-btn" onclick="switchTab('last_year')">Last Year</button>
        </div>

        <div class="table-container" id="standings-container">
            <div class="status-msg" id="standings-status">Evaluating arena champions...</div>
        </div>

        <div class="ledger-title">⚔ Battle Ledger Timeline</div>
        <div class="table-container" id="ledger-container" style="margin-top: 10px;">
            <div class="status-msg" id="ledger-status">Unrolling ancient ledger archives...</div>
        </div>
    </div>

    <script>
        const sheetId = '1V62YP2K9cdN8ws1cf3WTmKwXzzW83KUAFcOGgN_s99M';
        
        // Define spreadsheet tabs/sheets indices or names
        // Gviz allows targeting via gid (grid id) or sheet name
        // We will query the main spreadsheet structure.
        const url = `https://docs.google.com/spreadsheets/d/${sheetId}/gviz/tq?tqx=out:json`;

        let cachedData = null;
        let currentTab = 'month';

        window.addEventListener('DOMContentLoaded', () => {
            fetchData();
        });

        function fetchData() {
            fetch(url)
                .then(response => {
                    if (!response.ok) {
                        throw new Error('Network response was not ok: ' + response.statusText);
                    }
                    return response.text();
                })
                .then(responseText => {
                    // Extract clean JSON payload from Google Visualization wrapper
                    const matches = responseText.match(/google\.visualization\.Query\.setResponse\(([\s\S\w]*)\);/);
                    if (!matches || matches.length < 2) {
                        throw new Error('Invalid JSON structure returned from Google Sheets');
                    }
                    
                    const jsonObj = JSON.parse(matches[1]);
                    if (jsonObj.status === 'error') {
                        throw new Error(jsonObj.errors[0].detailed_message || 'Google Sheets API error');
                    }
                    
                    cachedData = jsonObj.table;
                    renderData();
                })
                .catch(err => {
                    console.error("Data load failed: ", err);
                    document.getElementById('standings-status').className = "error-msg";
                    document.getElementById('standings-status').innerText = "Failed to evaluate arena champions. Ensure the Google Sheet is set to 'Anyone with the link can view'.";
                    
                    document.getElementById('ledger-status').className = "error-msg";
                    document.getElementById('ledger-status').innerText = "Failed to unroll ancient ledger archives.";
                });
        }

        function switchTab(tabName) {
            currentTab = tabName;
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            event.currentTarget.classList.add('active');
            renderData();
        }

        function renderData() {
            if (!cachedData) return;

            const standingsStatus = document.getElementById('standings-status');
            const standingsContainer = document.getElementById('standings-container');
            const ledgerStatus = document.getElementById('ledger-status');
            const ledgerContainer = document.getElementById('ledger-container');

            // Clear previous elements if data exists
            standingsContainer.innerHTML = '';
            ledgerContainer.innerHTML = '';

            const cols = cachedData.cols.map(c => c.label || '');
            const rows = cachedData.rows;

            if (rows.length === 0) {
                standingsContainer.innerHTML = '<div class="status-msg">No champions found in this arena arena yet.</div>';
                ledgerContainer.innerHTML = '<div class="status-msg">The ledger is empty.</div>';
                return;
            }

            // Build Standings Table
            // Note: Since we don't have your explicit columns, this maps whatever columns are in sheet 1 dynamically.
            const standingsTable = document.createElement('table');
            const thead = document.createElement('thead');
            const thr = document.createElement('tr');
            
            // Generate Headers
            cols.forEach(colLabel => {
                const th = document.createElement('th');
                th.innerText = colLabel || 'Column';
                thr.appendChild(th);
            });
            thead.appendChild(thr);
            standingsTable.appendChild(thead);

            const tbody = document.createElement('tbody');
            
            // Generate Rows
            rows.forEach(rowData => {
                const tr = document.createElement('tr');
                rowData.c.forEach(cell => {
                    const td = document.createElement('td');
                    td.innerText = cell ? (cell.f || cell.v || '') : '';
                    tr.appendChild(td);
                });
                tbody.appendChild(tr);
            });
            
            standingsTable.appendChild(tbody);
            standingsContainer.appendChild(standingsTable);

            // Populate historical ledger container with a matching copy for visibility
            const ledgerTable = standingsTable.cloneNode(true);
            ledgerContainer.appendChild(ledgerTable);
        }
    </script>
</body>
</html>
