<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ludus Magnus: Poker Gladiator School</title>
    <style>
        :root {
            --bg-dark: #120c06;
            --container-bg: #1c140c;
            --gold-primary: #d4af37;
            --gold-dim: #aa841c;
            --text-light: #f5f0e6;
            --text-dim: #b5a999;
            --accent-red: #8b0000;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-light);
            font-family: 'Georgia', serif;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        header {
            text-align: center;
            margin-bottom: 30px;
        }

        .logo-container {
            width: 220px;
                height: 220px;
                margin: 0 auto 15px;
                display: flex;
                justify-content: center;
                align-items: center;
                border-radius: 50%;
                overflow: hidden;
                filter: drop-shadow(0 0 15px rgba(212, 175, 55, 0.4));
            }

        .logo-img {
            width: 100%;
                height: 100%;
                object-fit: cover;
                object-position: 52.3% 49.2%;
                transform: scale(1.15);
            }

        h1 {
            color: var(--gold-primary);
            text-transform: uppercase;
            letter-spacing: 2px;
            margin: 15px 0 5px 0;
            font-size: 2.5rem;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.6);
        }

        .subtitle {
            color: var(--text-dim);
            font-style: italic;
            margin-bottom: 25px;
        }

        .section-container {
            background-color: var(--container-bg);
            border: 2px solid var(--gold-dim);
            border-radius: 8px;
            padding: 25px;
            width: 100%;
            max-width: 900px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            margin-bottom: 40px;
            box-sizing: border-box;
        }

        h2 {
            color: var(--gold-primary);
            text-align: center;
            text-transform: uppercase;
            letter-spacing: 1px;
            border-bottom: 1px solid var(--gold-dim);
            padding-bottom: 10px;
            margin-top: 0;
        }

        .date-group {
            border: 1px solid #3a2a18;
            margin-bottom: 10px;
            border-radius: 4px;
            overflow: hidden;
        }

        .date-header {
            background-color: #261c10;
            padding: 12px 15px;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-weight: bold;
            color: var(--gold-primary);
            transition: background 0.2s;
        }

        .date-header:hover {
            background-color: #362817;
        }

        .date-header::after {
            content: '▼';
            font-size: 0.8rem;
            color: var(--text-dim);
        }

        .date-group.active .date-header::after {
            content: '▲';
        }

        .date-content {
            display: none;
            padding: 10px;
            background-color: #160f08;
            overflow-x: auto;
        }

        .date-group.active .date-content {
            display: block;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
        }

        th {
            color: var(--gold-dim);
            font-size: 0.85rem;
            text-transform: uppercase;
            padding: 10px;
            border-bottom: 2px solid #3a2a18;
        }

        td {
            padding: 10px;
            border-bottom: 1px solid #261c10;
            color: var(--text-light);
        }

        .podium-container {
            display: flex;
            flex-direction: column;
            gap: 20px;
            margin-top: 20px;
        }

        .gladiator-card {
            display: flex;
            align-items: center;
            padding: 15px 20px;
            border-radius: 6px;
            background: linear-gradient(135deg, #22180f 0%, #17100a 100%);
            border: 1px solid #44321e;
            position: relative;
        }

        .avatar-box {
            width: 65px;
            height: 65px;
            margin-right: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            border-radius: 50%;
            background: #110904;
        }

        .gladiator-info {
            flex-grow: 1;
        }

        .gladiator-name {
            font-size: 1.25rem;
            font-weight: bold;
            margin: 0;
        }

        .gladiator-status {
            font-size: 0.85rem;
            color: var(--text-dim);
            font-style: italic;
            margin: 2px 0 0 0;
        }

        .gladiator-score {
            font-size: 1.3rem;
            font-weight: bold;
            font-family: monospace;
        }

        .tier-champion {
            border: 2px solid var(--gold-primary);
            background: linear-gradient(135deg, #332507 0%, #1c1403 100%);
            box-shadow: 0 0 15px rgba(212, 175, 55, 0.2);
        }
        .tier-champion .gladiator-name { color: var(--gold-primary); }
        .tier-champion .avatar-box { border: 2px solid var(--gold-primary); }
        .tier-champion .gladiator-score { color: #2ecc71; }

        .tier-warrior { border-left: 4px solid var(--text-dim); }
        .tier-warrior .gladiator-score { color: var(--text-light); }

        .tier-donkey {
            border: 2px solid var(--accent-red);
            background: linear-gradient(135deg, #260a0a 0%, #140303 100%);
        }
        .tier-donkey .gladiator-name { color: #ff4d4d; }
        .tier-donkey .avatar-box { border: 2px solid var(--accent-red); }
        .tier-donkey .gladiator-score { color: #ff4d4d; }

        .loading {
            text-align: center;
            color: var(--text-dim);
            font-style: italic;
            padding: 20px;
        }
    </style>
</head>
<body>

    <header>
        <div class="logo-container">
            <img class="logo-img" src="logo.png?v=2" alt="Ludus Magnus Logo" id="main-logo" onerror="handleLogoError()">
            <svg id="fallback-logo" style="display:none; width:150px; height:150px;" viewBox="0 0 100 100">
                <path d="M50,5 L85,25 L85,65 C85,85 50,95 50,95 C50,95 15,85 15,65 L15,25 Z" fill="none" stroke="#d4af37" stroke-width="4"/>
                <path d="M35,35 L65,65 M65,35 L35,65" stroke="#aa841c" stroke-width="3"/>
            </svg>
        </div>
        <h1>Ludus Magnus</h1>
        <div class="subtitle">Poker Gladiator School • Circa 2026 AD</div>
    </header>

    <div class="section-container">
        <h2>Arena Standings</h2>
        <div id="standings-target">
            <div class="loading">Evaluating arena champions...</div>
        </div>
    </div>

    <div class="section-container">
        <h2>⚔ Battle Ledger Timeline</h2>
        <div id="ledger-target">
            <div class="loading">Unrolling ancient ledger archives...</div>
        </div>
    </div>

    <script>
        function handleLogoError() {
            document.getElementById('main-logo').style.display = 'none';
            document.getElementById('fallback-logo').style.display = 'block';
        }

        const sheetId = '1V62YP2K9cdN8ws1cf3WTmKwXzzW83KUAFcOGgN_s99M';
        const csvUrl = `https://docs.google.com/spreadsheets/d/${sheetId}/export?format=csv`;

        fetch(csvUrl)
            .then(res => {
                if(!res.ok) throw new Error("Network configuration block detected.");
                return res.text();
            })
            .then(csvText => {
                const rows = parseCSV(csvText);
                if(rows.length < 2) {
                    document.getElementById('standings-target').innerHTML = "<div class='loading'>The arena matrix ledger is empty.</div>";
                    document.getElementById('ledger-target').innerHTML = "<div class='loading'>No gladiators found.</div>";
                    return;
                }
                renderDynamicApp(rows);
            })
            .catch(err => {
                console.error(err);
                document.getElementById('standings-target').innerHTML = "<div class='loading' style='color:#8b0000;'>Connection Broken: Ensure your Google Sheet configuration settings are set public!</div>";
            });

        function parseCSV(text) {
            const lines = text.split('\n');
            return lines.map(line => {
                return line.split(/,(?=(?:(?:[^"]*"){2})*[^"]*$)/).map(cell => cell.replace(/^"|"$/g, '').trim());
            }).filter(line => line.length > 1 && line !== "");
        }

        function renderDynamicApp(dataRows) {
            const headers = dataRows[0].map(h => h.toUpperCase());
            const records = dataRows.slice(1);

            const idxDate = headers.indexOf('DATE');
            const idxName = headers.indexOf('NAME');
            const idxCashBuy = headers.indexOf('CASH BUYIN');
            const idxTourneyBuy = headers.indexOf('TOURNEY BUYIN');
            const idxCashWin = headers.indexOf('CASH WINNINGS');
            const idxTourneyWin = headers.indexOf('TOURNEY WINNINGS');
            const idxEvidence = headers.indexOf('EVIDENCE');

            const groups = {};
            records.forEach(row => {
                const date = row[idxDate] || 'Unknown Date';
                if(!groups[date]) groups[date] = [];
                groups[date].push(row);
            });

            let standingsHtml = '';
            Object.keys(groups).forEach((date, index) => {
                const isFirst = index === 0 ? 'active' : '';
                standingsHtml += `
                    <div class="date-group ${isFirst}" id="group-${index}">
                        <div class="date-header" onclick="toggleDate('group-${index}')">${date}</div>
                        <div class="date-content">
                            <table>
                                <thead>
                                    <tr>
                                        <th>Player</th>
                                        <th>Cash Buyin</th>
                                        <th>Tourney Buyin</th>
                                        <th>Cash Win</th>
                                        <th>Tourney Win</th>
                                        <th>Evidence</th>
                                    </tr>
                                </thead>
                                <tbody>
                `;

                groups[date].forEach(row => {
                    standingsHtml += `
                        <tr>
                            <td><strong>${row[idxName] || '-'}</strong></td>
                            <td>${row[idxCashBuy] || '0'}</td>
                            <td>${row[idxTourneyBuy] || '0'}</td>
                            <td>${row[idxCashWin] || '0'}</td>
                            <td>${row[idxTourneyWin] || '0'}</td>
                            <td>${row[idxEvidence] ? `<a href="${row[idxEvidence]}" target="_blank" style="color:#d4af37;">Link</a>` : '-'}</td>
                        </tr>
                    `;
                });

                standingsHtml += `</tbody></table></div></div>`;
            });
            document.getElementById('standings-target').innerHTML = standingsHtml;

            const playerTotals = {};
            records.forEach(row => {
                const name = row[idxName];
                if(!name) return;

                const cBuy = parseFloat(row[idxCashBuy]) || 0;
                const tBuy = parseFloat(row[idxTourneyBuy]) || 0;
                const cWin = parseFloat(row[idxCashWin]) || 0;
                const tWin = parseFloat(row[idxTourneyWin]) || 0;

                const netProfit = (cWin + tWin) - (cBuy + tBuy);

                if(!playerTotals[name]) playerTotals[name] = 0;
                playerTotals[name] += netProfit;
            });

            const rankedPlayers = Object.keys(playerTotals).map(name => ({
                name: name,
                score: playerTotals[name]
            })).sort((a, b) => b.score - a.score);

            if(rankedPlayers.length === 0) return;

            let ledgerHtml = '<div class="podium-container">';
            rankedPlayers.forEach((player, idx) => {
                let tierClass = 'tier-warrior';
                let rankTitle = 'Gladiator';
                let svgAvatar = `
                    <svg width="40" height="40" viewBox="0 0 100 100">
                        <circle cx="50" cy="40" r="20" fill="#b5a999"/>
                        <path d="M20,80 C20,60 80,60 80,80 Z" fill="#b5a999"/>
                    </svg>
                `;

                if(idx === 0) {
                    tierClass = 'tier-champion';
                    rankTitle = 'Primus • Arena Champion';
                    svgAvatar = `
                        <svg width="45" height="45" viewBox="0 0 100 100">
                            <circle cx="50" cy="50" r="45" fill="none" stroke="#d4af37" stroke-width="2"/>
                            <path d="M35,35 L65,35 L60,65 L50,80 L40,65 Z" fill="#d4af37"/>
                            <path d="M50,15 L50,35" stroke="#8b0000" stroke-width="8"/>
                        </svg>
                    `;
                } else if(idx === rankedPlayers.length - 1 && rankedPlayers.length > 1) {
                    tierClass = 'tier-donkey';
                    rankTitle = 'Asinus • Field Donkey';
                    svgAvatar = `
                        <svg width="40" height="40" viewBox="0 0 100 100">
                            <path d="M30,50 C20,20 35,30 40,45 C45,30 60,20 50,50 C60,70 40,80 30,50 Z" fill="#8b0000"/>
                            <circle cx="40" cy="60" r="3" fill="#fff"/>
                        </svg>
                    `;
                }

                const scoreFormatted = (player.score >= 0 ? '+' : '') + player.score;

                ledgerHtml += `
                    <div class="gladiator-card ${tierClass}">
                        <div class="avatar-box">${svgAvatar}</div>
                        <div class="gladiator-info">
                            <div class="gladiator-name">${player.name}</div>
                            <div class="gladiator-status">${rankTitle}</div>
                        </div>
                        <div class="gladiator-score">${scoreFormatted}</div>
                    </div>
                `;
            });

            ledgerHtml += '</div>';
            document.getElementById('ledger-target').innerHTML = ledgerHtml;
        }

        function toggleDate(id) {
            const el = document.getElementById(id);
            if(el) el.classList.toggle('active');
        }
    </script>
</body>
</html>
