<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ludus of Kris - Poker Ledger</title>
    <style>
        :root {
            --bg-color: #1a1613;
            --border-gold: #c5a059;
            --text-light: #f5efe6;
            --text-muted: #b5a499;
        }

        body {
            font-family: 'Georgia', serif;
            background-color: var(--bg-color);
            color: var(--text-light);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            height: 100vh;
        }

        header {
            text-align: center;
            margin-bottom: 20px;
        }

        .logo-container {
            width: 150px;
            height: 150px;
            margin: 0 auto 15px auto;
            border-radius: 50%;
            box-shadow: 0 0 20px rgba(197, 160, 89, 0.3);
            background-color: #221a14;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        .logo-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        h1 {
            font-family: 'Times New Roman', serif;
            letter-spacing: 2px;
            color: var(--border-gold);
            margin: 0 0 5px 0;
            text-transform: uppercase;
        }

        .subtitle {
            font-size: 0.9rem;
            color: var(--text-muted);
            letter-spacing: 1px;
            text-transform: uppercase;
            margin-bottom: 20px;
        }

        .arena-frame-container {
            width: 100%;
            max-width: 1100px;
            height: 65vh;
            border: 2px solid var(--border-gold);
            border-radius: 4px;
            box-shadow: 0 0 15px rgba(0, 0, 0, 0.5);
            background-color: #ffffff; /* Keeps the excel grid perfectly readable */
            overflow: hidden;
        }

        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
    </style>
</head>
<body>

    <header>
        <div class="logo-container">
            <img src="logo.png" alt="Ludus of Kris Logo">
        </div>
        <h1>Ludus of Kris</h1>
        <div class="subtitle">Gladiatorial Poker Ledger</div>
    </header>

    <div class="arena-frame-container">
        <iframe src="https://docs.google.com/spreadsheets/d/e/2PACX-1vSDIibON5roY3ezG3RtD5mVPV50IN9Fj52wSwRQqwNK6Fvyyb49OY53ZZImAbVNgBW29-1qKLRid08L/pubhtml?gid=0&amp;single=true&amp;widget=true&amp;headers=false"></iframe>
    </div>

</body>
</html>
