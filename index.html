<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ludus of Kris - Poker Lanista</title>
    <style>
        :root {
            --bg-color: #1a1613;
            --card-bg: #2a221d;
            --border-gold: #c5a059;
            --text-light: #f5efe6;
            --text-muted: #b5a499;
            --profit-green: #4caf50;
            --loss-red: #f44336;
        }

        body {
            font-family: 'Georgia', serif;
            background-color: var(--bg-color);
            color: var(--text-light);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        header {
            text-align: center;
            margin-bottom: 30px;
        }

        .logo-container {
            width: 180px;
            height: 180px;
            margin: 0 auto 15px auto;
            border-radius: 50%;
            box-shadow: 0 0 20px rgba(197, 160, 89, 0.3);
            background-color: #221a14;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        .logo-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        h1 {
            font-family: 'Times New Roman', serif;
            letter-spacing: 2px;
            color: var(--border-gold);
            margin: 0 0 5px 0;
            text-transform: uppercase;
        }

        .subtitle {
            font-size: 0.9rem;
            color: var(--text-muted);
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .accordion-container {
            width: 100%;
            max-width: 1000px;
        }

        .date-section {
            background-color: var(--card-bg);
            border: 1px solid #3d312a;
            border-left: 4px solid var(--border-gold);
            margin-bottom: 12px;
            border-radius: 4px;
            overflow: hidden;
        }

        .date-header {
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
            user-select: none;
            font-weight: bold;
            font-size: 1.1rem;
            letter-spacing: 1px;
            background: linear-gradient(to right, #2a221d, #362b24);
        }

        .date-header:hover {
            background: #362b24;
        }

        .arrow {
            transition: transform 0.2s ease;
            color: var(--border-gold);
            display: inline-block;
        }

        .date-content {
            display: none;
            padding: 0;
            overflow-x: auto;
            border-top: 1px solid #3d312a;
        }

        .date-section.active .date-content {
            display: block;
        }

        .date-section.active .arrow {
            transform: rotate(90deg);
        }

        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
            min-width: 800px;
        }

        th, td {
            padding: 12px 15px;
            border-bottom: 1px solid #3d312a;
            font-size: 0.95rem;
        }

        th {
            background-color: #231c18;
            color: var(--border-gold);
            font-family: 'Times New Roman', serif;
            text-transform: uppercase;
            font-size: 0.85rem;
            letter-spacing: 1px;
        }

        tr:hover {
            background-color: #312822;
        }

        .amount {
            font-family: monospace;
            font-size: 1rem;
        }

        .profit { color: var(--profit-green); font-weight: bold; }
        .loss { color: var(--loss-red); }
        .neutral { color: var(--text-muted); }

        .evidence-container {
            padding: 15px 20px;
            background-color: #201915;
            border-top: 1px dashed #3d312a;
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .btn-evidence {
            background-color: transparent;
            border: 1px solid var(--border-gold);
            color: var(--border-gold);
            padding: 6px 14px;
            font-family: 'Times New Roman', serif;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-size: 0.8rem;
            cursor: pointer;
            border-radius: 3px;
            transition: all 0.2s ease;
            text-decoration: none;
            display: inline-block;
        }

        .btn-evidence:hover {
            background-color: var(--border-gold);
            color: var(--bg-color);
        }

        .loading {
            text-align: center;
            padding: 40px;
            color: var(--border-gold);
            font-style: italic;
        }
    </style>
</head>
<body>

    <header>
        <div class="logo-container">
            <img src="logo.png" alt="Ludus of Kris Logo">
        </div>
        <h1>Ludus of Kris</h1>
        <div class="subtitle">Gladiatorial Poker School</div>
    </header>

    <div class="accordion-container" id="ledger">
        <div class="loading">Gathering scroll data from the Ludus...</div>
    </div>

    <script>
        const SHEET_ID = '1V62YP2K9cdN8ws1cf3WTmKwXzzW83KUAFcOGgN_s99M';
        const SHEET_URL = `https://google.com{SHEET_ID}/export?format=csv&gid=0`;

        async function fetchPokerData() {
            try {
                const response = await fetch(SHEET_URL);
                if (!response.ok) throw new Error('File access error');
                const csvText = await response.text();
                parseAndRenderData(csvText);
            } catch (error) {
                document.getElementById('ledger').innerHTML = `
                    <div class="loading" style="color:var(--loss-red);">
                        Error accessing records. Check console log metrics.
                    </div>`;
                console.error(error);
            }
        }

        function parseAndRenderData(csvData) {
            // Split lines safely accounting for commas within quoted boundaries
            const rows = csvData.split(/\r?\n/).map(line => {
                return line.split(/,(?=(?:(?:[^"]*"){2})*[^"]*$)/).map(val => val.replace(/^"|"$/g, '').trim());
            });

            if (rows.length < 2) {
                document.getElementById('ledger').innerHTML = '<div class="loading">No arena records found.</div>';
                return;
            }

            // Simple header index identifier targeting exact cell phrases
            const headers = rows[0].map(h => h.toLowerCase().replace(/\s+/g, ''));
            const dateIdx = headers.findIndex(h => h.includes('date'));
            const nameIdx = headers.findIndex(h => h.includes('name'));
            const cashBuyIdx = headers.findIndex(h => h.includes('cashbuy'));
            const tourneyBuyIdx = headers.findIndex(h => h.includes('tourneybuy') || h.includes('tournby'));
            const cashWinIdx = headers.findIndex(h => h.includes('cashwin'));
            const tourneyWinIdx = headers.findIndex(h => h.includes('tourneywin') || h.includes('tournwn'));
            const evidenceIdx = headers.findIndex(h => h.includes('evid') || h.includes('proof') || h.includes('screenshot'));

            const sessionsByDate = {};

            for (let i = 1; i < rows.length; i++) {
                const currentLine = rows[i];
                if (!currentLine || currentLine.length < 2 || !currentLine[dateIdx]) continue;

                const dateValue = currentLine[dateIdx];
                const nameValue = currentLine[nameIdx] || "Unknown Gladiator";

                // Read matched index mappings, default to direct indices 2,3,4,5 if columns break
                const cBuy = parseFloat(currentLine[cashBuyIdx !== -1 ? cashBuyIdx : 2]) || 0;
                const tBuy = parseFloat(currentLine[tourneyBuyIdx !== -1 ? tourneyBuyIdx : 3]) || 0;
                const cWin = parseFloat(currentLine[cashWinIdx !== -1 ? cashWinIdx : 4]) || 0;
                const tWin = parseFloat(currentLine[tourneyWinIdx !== -1 ? tourneyWinIdx : 5]) || 0;
                const evidenceUrl = evidenceIdx !== -1 ? currentLine[evidenceIdx] : "";

                if (!sessionsByDate[dateValue]) {
                    sessionsByDate[dateValue] = { players: [], evidenceUrl: "" };
                }

                if (evidenceUrl && !sessionsByDate[dateValue].evidenceUrl) {
                    sessionsByDate[dateValue].evidenceUrl = evidenceUrl;
                }

                const totalBuyin = cBuy + tBuy;
                const totalWinnings = cWin + tWin;
                const netProfit = totalWinnings - totalBuyin;

                sessionsByDate[dateValue].players.push({
                    name: nameValue,
                    cashBuyin: cBuy,
                    tourneyBuyin: tBuy,
                    totalBuyin: totalBuyin,
                    cashWinnings: cWin,
                    tourneyWinnings: tWin,
                    totalWinnings: totalWinnings,
                    netProfit: netProfit
                });
            }

            const sortedDates = Object.keys(sessionsByDate).sort((a, b) => new Date(b) - new Date(a));
            const container = document.getElementById('ledger');
            container.innerHTML = '';

            if (sortedDates.length === 0) {
                container.innerHTML = '<div class="loading">No structural log records resolved.</div>';
                return;
            }

            sortedDates.forEach((date, index) => {
                const section = document.createElement('div');
                section.className = `date-section ${index === 0 ? 'active' : ''}`;
