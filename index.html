<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ludus of Kris - Poker Ledger</title>
    <style>
        :root {
            --bg-color: #1a1613;
            --card-bg: #2a221d;
            --border-gold: #c5a059;
            --text-light: #f5efe6;
            --text-muted: #b5a499;
            --profit-green: #4caf50;
            --loss-red: #f44336;
        }

        body {
            font-family: 'Georgia', serif;
            background-color: var(--bg-color);
            color: var(--text-light);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        header {
            text-align: center;
            margin-bottom: 30px;
        }

        /* Using your custom Roman Ludus logo element */
        .logo-container {
            width: 180px;
            height: 180px;
            margin: 0 auto 15px auto;
            border-radius: 50%;
            box-shadow: 0 0 20px rgba(197, 160, 89, 0.3);
            background-color: #221a14;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        .logo-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        h1 {
            font-family: 'Times New Roman', serif;
            letter-spacing: 2px;
            color: var(--border-gold);
            margin: 0 0 5px 0;
            text-transform: uppercase;
        }

        .subtitle {
            font-size: 0.9rem;
            color: var(--text-muted);
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .accordion-container {
            width: 100%;
            max-width: 1000px;
        }

        .date-section {
            background-color: var(--card-bg);
            border: 1px solid #3d312a;
            border-left: 4px solid var(--border-gold);
            margin-bottom: 12px;
            border-radius: 4px;
            overflow: hidden;
        }

        .date-header {
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
            user-select: none;
            font-weight: bold;
            font-size: 1.1rem;
            letter-spacing: 1px;
            background: linear-gradient(to right, #2a221d, #362b24);
        }

        .date-header:hover {
            background: #362b24;
        }

        .arrow {
            transition: transform 0.2s ease;
            color: var(--border-gold);
        }

        .date-content {
            display: none;
            padding: 0;
            overflow-x: auto;
            border-top: 1px solid #3d312a;
        }

        /* Active/Expanded states */
        .date-section.active .date-content {
            display: block;
        }

        .date-section.active .arrow {
            transform: rotate(90deg);
        }

        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
            min-width: 800px;
        }

        th, td {
            padding: 12px 15px;
            border-bottom: 1px solid #3d312a;
            font-size: 0.95rem;
        }

        th {
            background-color: #231c18;
            color: var(--border-gold);
            font-family: 'Times New Roman', serif;
            text-transform: uppercase;
            font-size: 0.85rem;
            letter-spacing: 1px;
        }

        tr:hover {
            background-color: #312822;
        }

        .amount {
            font-family: monospace;
            font-size: 1rem;
        }

        .profit { color: var(--profit-green); font-weight: bold; }
        .loss { color: var(--loss-red); }
        .neutral { color: var(--text-muted); }

        .loading {
            text-align: center;
            padding: 40px;
            color: var(--border-gold);
            font-style: italic;
        }
    </style>
</head>
<body>

    <header>
        <div class="logo-container">
            <!-- Replace 'logo.png' with your actual downloaded image path or web URL -->
            <img src="logo.png" alt="Ludus of Kris Logo">
        </div>
        <h1>Ludus of Kris</h1>
        <div class="subtitle">Gladiatorial Poker Ledger</div>
    </header>

    <div class="accordion-container" id="ledger">
        <div class="loading">Gathering scroll data from the Ludus...</div>
    </div>

    <script>
        // Paste your published Google Sheet ID below
        const SHEET_ID = '1V62YP2K9cdN8ws1cf3WTmKwXzzW83KUAFcOGgN_s99M';
        const SHEET_URL = `https://google.com{SHEET_ID}/gviz/tq?tqx=out:csv`;

        async function fetchPokerData() {
            try {
                const response = await fetch(SHEET_URL);
                const csvText = await response.text();
                parseAndRenderData(csvText);
            } catch (error) {
                document.getElementById('ledger').innerHTML = `<div class="loading" style="color:red;">Error accessing records. Verify Sheet sharing configuration.</div>`;
                console.error(error);
            }
        }

        function parseAndRenderData(csvData) {
            // Simple robust CSV line splitter
            const lines = csvData.split(/\r?\n/).map(line => {
                return line.split(/,(?=(?:(?:[^"]*"){2})*[^"]*$)/).map(val => val.replace(/^"|"$/g, '').trim());
            });

            // Assuming headers: Date, Name, Cash Buyin, Tourney Buyin, Cash Winnings, Tourney Winnings
            const dataRows = lines.slice(1).filter(row => row.length >= 6 && row[0] !== "");

            // Group transactions by date
            const sessionsByDate = {};
            dataRows.forEach(row => {
                const date = row[0];
                if (!sessionsByDate[date]) sessionsByDate[date] = [];

                const cashBuyin = parseFloat(row[2]) || 0;
                const tourneyBuyin = parseFloat(row[3]) || 0;
                const cashWinnings = parseFloat(row[4]) || 0;
                const tourneyWinnings = parseFloat(row[5]) || 0;

                const totalBuyin = cashBuyin + tourneyBuyin;
                const totalWinnings = cashWinnings + tourneyWinnings;
                const netProfit = totalWinnings - totalBuyin;

                sessionsByDate[date].push({
                    name: row[1],
                    cashBuyin,
                    tourneyBuyin,
                    totalBuyin,
                    cashWinnings,
                    tourneyWinnings,
                    totalWinnings,
                    netProfit
                });
            });

            // Sort dates descending
            const sortedDates = Object.keys(sessionsByDate).sort((a, b) => new Date(b) - new Date(a));
            const container = document.getElementById('ledger');
            container.innerHTML = '';

            if (sortedDates.length === 0) {
                container.innerHTML = '<div class="loading">No arena records found.</div>';
                return;
            }

            sortedDates.forEach((date, index) => {
                const section = document.createElement('div');
                section.className = `date-section ${index === 0 ? 'active' : ''}`; // Auto-expand first item

                // Standardize display date layout
                const displayDate = new Date(date).toLocaleDateString('en-US', {
                    weekday: 'long', year: 'numeric', month: 'long', day: 'numeric'
                }) === 'Invalid Date' ? date : new Date(date).toLocaleDateString('en-US', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' });

                section.innerHTML = `
                    <div class="date-header" onclick="toggleAccordion(this)">
                        <span>🏛️ Session: ${displayDate}</span>
                        <span class="arrow">▶</span>
                    </div>
                    <div class="date-content">
                        <table>
                            <thead>
                                <tr>
                                    <th>Gladiator Name</th>
                                    <th>Cash Buy-In</th>
                                    <th>Tourney Buy-In</th>
                                    <th>Total Buy-In</th>
                                    <th>Cash Winnings</th>
                                    <th>Tourney Winnings</th>
                                    <th>Total Winnings</th>
                                    <th>Net Profit / Loss</th>
                                </tr>
                            </thead>
                            <tbody>
                                ${sessionsByDate[date].map(player => {
                                    const profitClass = player.netProfit > 0 ? 'profit' : (player.netProfit < 0 ? 'loss' : 'neutral');
                                    const prefix = player.netProfit > 0 ? '+' : '';
                                    return `
                                        <tr>
                                            <td><strong>${player.name}</strong></td>
                                            <td class="amount">$${player.cashBuyin.toFixed(2)}</td>
                                            <td class="amount">$${player.tourneyBuyin.toFixed(2)}</td>
                                            <td class="amount"><strong>$${player.totalBuyin.toFixed(2)}</strong></td>
                                            <td class="amount">$${player.cashWinnings.toFixed(2)}</td>
                                            <td class="amount">$${player.tourneyWinnings.toFixed(2)}</td>
